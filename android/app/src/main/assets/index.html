<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MiMo 桌面宠物</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none;
      -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden;
    background:linear-gradient(160deg,#FFF6F0,#FFE7D6 60%,#FFD9C2);
    font-family:"PingFang SC","Microsoft YaHei",sans-serif; }

  #pet { position:absolute; left:50%; top:38%; width:190px; height:210px;
    margin-left:-95px; touch-action:none; z-index:10; }
  #petFloat { width:100%; height:100%; animation:float 3.2s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-11px)} }
  svg { width:100%; height:100%; overflow:visible; }
  .tail { transform-origin:150px 138px; animation:wag 2.4s ease-in-out infinite; }
  @keyframes wag { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(12deg)} }
  .antenna-ball { animation:glow 2s ease-in-out infinite; }
  @keyframes glow { 0%,100%{opacity:.95;transform:scale(1)} 50%{opacity:.6;transform:scale(.86)} }
  .eye-group { transform-origin:center; animation:blink 4.5s infinite; }
  @keyframes blink { 0%,92%,100%{transform:scaleY(1)} 95%{transform:scaleY(.08)} }

  #bubble { position:absolute; left:50%; top:-10px; transform:translate(-50%,-100%) scale(.6);
    transform-origin:bottom center; min-width:150px; max-width:78vw; background:#fff;
    border-radius:18px; padding:12px 16px; box-shadow:0 12px 30px rgba(0,0,0,.18);
    font-size:13px; color:#333; line-height:1.65; opacity:0; pointer-events:none;
    transition:.25s cubic-bezier(.34,1.56,.64,1); text-align:center; }
  #bubble.show { opacity:1; transform:translate(-50%,-100%) scale(1); }
  #bubble::after { content:""; position:absolute; left:50%; bottom:-8px; transform:translateX(-50%);
    border:9px solid transparent; border-top-color:#fff; border-bottom:0; }
  #bubble b { color:#FF6A2B; }
  .dots span { display:inline-block; width:7px; height:7px; margin:0 2px; border-radius:50%;
    background:#FF6A2B; animation:dot 1s infinite; }
  .dots span:nth-child(2){animation-delay:.15s} .dots span:nth-child(3){animation-delay:.3s}
  @keyframes dot { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-6px);opacity:1} }

  #tabbar { position:absolute; left:50%; bottom:26px; transform:translateX(-50%);
    display:flex; gap:10px; z-index:20; }
  #tabbar button { width:58px; height:58px; border-radius:50%; border:none; font-size:22px;
    background:#fff; box-shadow:0 8px 20px rgba(255,106,43,.28); }

  #panel { position:absolute; left:0; right:0; bottom:0; max-height:72vh; overflow-y:auto;
    background:rgba(255,255,255,.98); border-radius:26px 26px 0 0; padding:22px 18px 30px;
    box-shadow:0 -12px 40px rgba(0,0,0,.18); transform:translateY(110%);
    transition:.35s cubic-bezier(.3,1.2,.5,1); z-index:30; }
  #panel.show { transform:translateY(0); }
  #panel h3 { font-size:16px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  #panel h3 .dot { width:9px; height:9px; border-radius:50%; background:#FF6A2B; }
  .balance-card { background:linear-gradient(135deg,#FF8A4C,#FF5B2E); border-radius:18px;
    padding:16px; color:#fff; margin-bottom:12px; position:relative; overflow:hidden; }
  .balance-card::after { content:"MiMo"; position:absolute; right:-6px; bottom:-18px;
    font-size:60px; font-weight:800; opacity:.13; }
  .balance-card .label { font-size:12px; opacity:.85; }
  .balance-card .num { font-size:32px; font-weight:700; margin:3px 0 10px; }
  .row { display:flex; justify-content:space-between; font-size:12px; opacity:.92;
    padding:5px 0; border-top:1px solid rgba(255,255,255,.22); }
  label { font-size:11px; color:#A9826B; }
  input, select { width:100%; padding:11px 12px; border-radius:12px; border:1.5px solid #F0DCCF;
    font-size:13px; margin:4px 0 10px; outline:none; background:#fff; user-select:text;
    -webkit-user-select:text; }
  .btn { width:100%; padding:13px; border-radius:14px; border:none; font-size:14px;
    font-weight:600; background:#FF6A2B; color:#fff; margin-top:4px; }
  .btn.ghost { background:#FFF0E7; color:#FF6A2B; }
  .mini { font-size:11px; color:#B0917D; line-height:1.7; margin-top:8px; }
  .tag { display:inline-block; font-size:10px; padding:2px 7px; border-radius:99px;
    background:#EAF7EE; color:#2E9E5B; margin-left:6px; }
  .tag.warn { background:#FFF3E0; color:#D98324; }
  .heart { position:absolute; font-size:18px; pointer-events:none; z-index:99;
    animation:rise 1.1s ease-out forwards; }
  @keyframes rise { to{ transform:translateY(-90px) scale(1.5); opacity:0 } }
  .title { position:absolute; top:24px; width:100%; text-align:center; color:#D9825C;
    font-size:13px; letter-spacing:2px; }
</style>
</head>
<body>

<div class="title">M I M O · 桌 面 宠 物</div>

<div id="pet">
  <div id="bubble"></div>
  <div id="petFloat">
    <svg viewBox="0 0 200 210">
      <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FF9A5C"/><stop offset="100%" stop-color="#FF6A2B"/>
      </linearGradient></defs>
      <ellipse cx="100" cy="196" rx="52" ry="9" fill="rgba(0,0,0,.10)"/>
      <path class="tail" d="M150 138 q42 -6 30 -46" stroke="#FF7A45" stroke-width="15"
        fill="none" stroke-linecap="round"/>
      <path d="M52 62 L42 18 L88 46 Z" fill="url(#g1)"/>
      <path d="M148 62 L158 18 L112 46 Z" fill="url(#g1)"/>
      <path d="M58 56 L52 30 L78 46 Z" fill="#FFD3BC"/>
      <path d="M142 56 L148 30 L122 46 Z" fill="#FFD3BC"/>
      <line x1="100" y1="52" x2="100" y2="26" stroke="#FF7A45" stroke-width="5" stroke-linecap="round"/>
      <circle class="antenna-ball" cx="100" cy="20" r="9" fill="#FFD23F"/>
      <ellipse cx="100" cy="118" rx="62" ry="57" fill="url(#g1)"/>
      <ellipse cx="100" cy="134" rx="38" ry="32" fill="#FFF2E8"/>
      <ellipse cx="46" cy="132" rx="14" ry="19" fill="#FF7A45" transform="rotate(18 46 132)"/>
      <ellipse cx="154" cy="132" rx="14" ry="19" fill="#FF7A45" transform="rotate(-18 154 132)"/>
      <ellipse cx="76" cy="176" rx="17" ry="11" fill="#FF7A45"/>
      <ellipse cx="124" cy="176" rx="17" ry="11" fill="#FF7A45"/>
      <ellipse cx="62" cy="122" rx="11" ry="7" fill="#FF5F49" opacity=".45"/>
      <ellipse cx="138" cy="122" rx="11" ry="7" fill="#FF5F49" opacity=".45"/>
      <g class="eye-group">
        <ellipse cx="76" cy="104" rx="15" ry="17" fill="#3B2417"/>
        <ellipse cx="124" cy="104" rx="15" ry="17" fill="#3B2417"/>
        <circle cx="76" cy="104" r="7" fill="#fff"/><circle cx="124" cy="104" r="7" fill="#fff"/>
        <circle cx="79" cy="111" r="3.2" fill="#fff" opacity=".8"/>
        <circle cx="127" cy="111" r="3.2" fill="#fff" opacity=".8"/>
      </g>
      <ellipse cx="100" cy="124" rx="5" ry="3.6" fill="#C4472B"/>
      <path class="mouth" d="M88 133 q12 11 24 0" stroke="#C4472B" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
    </svg>
  </div>
</div>

<div id="tabbar">
  <button onclick="queryBalance()">💰</button>
  <button onclick="petMe(event)">🖐️</button>
  <button onclick="togglePanel()">⚙️</button>
</div>

<div id="panel">
  <h3><span class="dot"></span><span id="panelTitle">API 余额</span></h3>

  <div class="balance-card">
    <div class="label">账户总余额</div>
    <div class="num" id="totalBal">¥ --</div>
    <div class="row"><span>现金余额</span><span id="cashBal">--</span></div>
    <div class="row"><span>赠送 / 代金券</span><span id="giftBal">--</span></div>
    <div class="row"><span>已消耗</span><span id="usedBal">--</span></div>
    <div class="row"><span>有效期至</span><span id="expireAt">--</span></div>
  </div>

  <label>选择服务商（接口已预设）</label>
  <select id="provider" onchange="onProviderChange()"></select>

  <label>API Key（仅保存在手机本地）</label>
  <input id="apiKey" type="password" placeholder="sk-...">
  <input id="customUrl" placeholder="余额接口地址（默认已预设，可覆盖）">

  <button class="btn" onclick="queryBalance()">🔄 立即查询余额</button>
  <button class="btn ghost" onclick="saveSettings()">💾 保存配置</button>
  <button class="btn ghost" style="background:#F3EEE8;color:#8A6B54" onclick="openConsole()">🌐 打开服务商控制台</button>

  <div class="mini" id="providerNote"></div>
</div>

<script>
/* ===== 各家余额接口预设（和桌面版一致）===== */
const PROVIDERS = [
  { id:'mimo', name:'小米 MiMo', icon:'🟠', currency:'¥', verified:false,
    balanceUrl:'https://api.mimo.xiaomi.com/v1/user/balance',
    consoleUrl:'https://mimo.xiaomi.com/',
    note:'MiMo 接口地址请以官方开放平台文档为准，可在下方输入框覆盖修改。',
    parse:j=>genericParse(j) },
  { id:'deepseek', name:'DeepSeek', icon:'🐋', currency:'¥', verified:true,
    balanceUrl:'https://api.deepseek.com/user/balance',
    consoleUrl:'https://platform.deepseek.com/usage',
    note:'DeepSeek 官方余额接口 GET /user/balance。',
    parse:j=>{ const b=(j.balance_infos||[])[0]||{}; const t=+b.total_balance||0, g=+b.granted_balance||0;
      return { total:t, cash:t-g, gift:g, used:0, expire:'--' }; } },
  { id:'kimi', name:'Kimi / Moonshot', icon:'🌙', currency:'¥', verified:true,
    balanceUrl:'https://api.moonshot.cn/v1/users/me/balance',
    consoleUrl:'https://platform.moonshot.cn/console/account',
    note:'Moonshot 官方接口 GET /v1/users/me/balance。',
    parse:j=>{ const d=j.data||j; return { total:+d.available_balance||0, cash:+d.cash_balance||0,
      gift:+d.voucher_balance||0, used:0, expire:'--' }; } },
  { id:'openrouter', name:'OpenRouter', icon:'🔀', currency:'$', verified:true,
    balanceUrl:'https://openrouter.ai/api/v1/credits',
    consoleUrl:'https://openrouter.ai/credits',
    note:'OpenRouter 官方接口 GET /api/v1/credits（美元）。',
    parse:j=>{ const d=j.data||j; const c=+d.total_credits||0, u=+d.total_usage||0;
      return { total:c-u, cash:c-u, gift:0, used:u, expire:'--' }; } },
  { id:'siliconflow', name:'硅基流动 SiliconFlow', icon:'🩶', currency:'¥', verified:false,
    balanceUrl:'https://api.siliconflow.cn/v1/user/info',
    consoleUrl:'https://cloud.siliconflow.cn/account/finance',
    note:'SiliconFlow 用户信息接口含余额字段，字段变动时可覆盖地址。',
    parse:j=>{ const d=j.data||j; const c=+(d.charge_balance??d.chargeBalance??0);
      const g=+(d.gift_balance??d.giftBalance??0);
      return { total:+(d.balance??(c+g)), cash:c, gift:g, used:0, expire:'--' }; } },
  { id:'zhipu', name:'智谱 GLM / BigModel', icon:'🧠', currency:'¥', verified:false,
    balanceUrl:'https://open.bigmodel.cn/api/paas/v4/users/balance',
    consoleUrl:'https://open.bigmodel.cn/usercenter/proj-mgmt/billing',
    note:'智谱余额多在控制台展示，接口 403/404 时请点"打开控制台"。',
    parse:j=>genericParse(j) },
  { id:'minimax', name:'MiniMax', icon:'🌀', currency:'¥', verified:false,
    balanceUrl:'https://api.minimax.chat/v1/get_balance',
    consoleUrl:'https://platform.minimaxi.com/user-center/basic-information',
    note:'MiniMax 接口以官方文档为准，可在此覆盖地址。',
    parse:j=>genericParse(j) },
  { id:'qwen', name:'阿里百炼 Qwen', icon:'☁️', currency:'¥', verified:false,
    balanceUrl:'', consoleUrl:'https://bailian.console.aliyun.com/',
    note:'阿里云余额需 BSS 签名（AK/SK），请点"打开控制台"查看。',
    parse:j=>genericParse(j) },
  { id:'doubao', name:'火山方舟 豆包', icon:'🌋', currency:'¥', verified:false,
    balanceUrl:'', consoleUrl:'https://console.volcengine.com/ark',
    note:'火山余额在财务控制台展示，请点"打开控制台"查看。',
    parse:j=>genericParse(j) },
  { id:'mock', name:'演示模式（不联网）', icon:'🎲', currency:'¥', verified:true,
    balanceUrl:'', consoleUrl:'', note:'随机生成余额，体验宠物交互。',
    parse:()=>{ const used=Math.random()*60+5;
      return { total:100-used, cash:60-used*.6, gift:40-used*.4, used, expire:'2027-04-30' }; } }
];

function genericParse(j) {
  const d = j && (j.data || j.result || j);
  const find = (...ks) => { for (const k of ks) if (d && typeof d[k] === 'number') return d[k]; return null; };
  const t = find('balance','total_balance','available_balance','credit','amount');
  if (t === null) throw new Error('没找到余额字段：' + JSON.stringify(j).slice(0, 100));
  return { total:t, cash:find('cash_balance')??t, gift:find('gift_balance','voucher_balance','granted_balance')??0,
           used:find('used','total_usage')??0, expire:'--' };
}

/* ===== 状态 ===== */
const $ = s => document.querySelector(s);
let settings = { providerId:'mock', keys:{}, urlOverrides:{} };
let current = PROVIDERS.find(p => p.id === 'mock');
let bubbleTimer;

const sel = $('#provider');
PROVIDERS.forEach(p => {
  const o = document.createElement('option');
  o.value = p.id; o.textContent = `${p.icon} ${p.name}${p.verified ? ' ✔' : ''}`;
  sel.appendChild(o);
});

function initSettings() {
  try { Object.assign(settings, JSON.parse(Android.loadSettings() || '{}')); } catch(e) {}
  sel.value = settings.providerId || 'mock';
  onProviderChange();
  say('你好呀，我是 MiMo 宠物！<br>点我一下就<b>查余额</b> 💰', 5000);
}
function onProviderChange() {
  current = PROVIDERS.find(p => p.id === sel.value) || PROVIDERS[0];
  settings.providerId = current.id;
  $('#apiKey').value = settings.keys[current.id] || '';
  $('#customUrl').value = settings.urlOverrides[current.id] ?? current.balanceUrl;
  $('#providerNote').innerHTML =
    (current.verified ? '<span class="tag">官方接口</span>' : '<span class="tag warn">接口可编辑</span>') + ' ' + current.note;
  $('#panelTitle').textContent = current.icon + ' ' + current.name + ' 余额';
  $('#totalBal').textContent = current.currency + ' --';
}
function saveSettings() {
  settings.keys[current.id] = $('#apiKey').value.trim();
  settings.urlOverrides[current.id] = $('#customUrl').value.trim();
  Android.saveSettings(JSON.stringify(settings));
  say('配置保存好啦！✅');
}
function openConsole() { if (current.consoleUrl) window.open(current.consoleUrl, '_blank'); }

/* ===== 查询（走原生桥，无跨域）===== */
async function queryBalance() {
  say(`正在查询 ${current.name} 余额…<div class="dots"><span></span><span></span><span></span></div>`, 0);
  $('#pet').animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],
    {duration:420, easing:'ease-in-out'});
  try {
    let data;
    if (current.id === 'mock') {
      await new Promise(r => setTimeout(r, 700));
      data = current.parse();
    } else {
      const url = $('#customUrl').value.trim() || current.balanceUrl;
      const key = $('#apiKey').value.trim();
      if (!url) throw new Error('该服务商无公开余额接口，请点"打开控制台"');
      if (!key) throw new Error('请先填入 ' + current.name + ' 的 API Key');
      const res = JSON.parse(Android.httpGet(url,
        JSON.stringify({ Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' })));
      if (!res.ok) throw new Error(`接口返回 ${res.status} ${(res.text || '').slice(0, 60)}`);
      data = current.parse(JSON.parse(res.text || '{}'));
    }
    render(data);
    say(`查到啦！🎉<br>${current.name} 余额 <b>${current.currency}${data.total.toFixed(2)}</b>` +
        (data.used ? `<br>已消耗 <b>${current.currency}${data.used.toFixed(2)}</b>` : ''), 5000);
  } catch (err) {
    say('查询失败 😿<br><span style="color:#999;font-size:12px">' +
        String(err.message || err).slice(0, 80) + '</span>', 5200);
  }
}
function render(d) {
  $('#totalBal').textContent = current.currency + ' ' + d.total.toFixed(2);
  $('#cashBal').textContent  = current.currency + ' ' + (d.cash ?? 0).toFixed(2);
  $('#giftBal').textContent  = current.currency + ' ' + (d.gift ?? 0).toFixed(2);
  $('#usedBal').textContent  = current.currency + ' ' + (d.used ?? 0).toFixed(2);
  $('#expireAt').textContent = d.expire || '--';
}

/* ===== 触摸拖动宠物 / 轻点查询 ===== */
const pet = $('#pet');
let dragging = false, moved = false, sx = 0, sy = 0, pl = 0, pt = 0;
pet.addEventListener('touchstart', e => {
  const t = e.touches[0];
  dragging = true; moved = false;
  sx = t.clientX; sy = t.clientY; pl = pet.offsetLeft; pt = pet.offsetTop;
}, { passive: true });
pet.addEventListener('touchmove', e => {
  if (!dragging) return;
  const t = e.touches[0];
  if (Math.abs(t.clientX - sx) + Math.abs(t.clientY - sy) > 8) moved = true;
  pet.style.left = (pl + t.clientX - sx) + 'px';
  pet.style.top  = (pt + t.clientY - sy) + 'px';
  pet.style.marginLeft = '0';
}, { passive: true });
pet.addEventListener('touchend', () => {
  dragging = false;
  if (!moved) queryBalance();       // 轻点 = 查余额
});
pet.addEventListener('dblclick', () => say('耶！✌️'));

function say(html, duration = 3200) {
  const b = $('#bubble');
  b.innerHTML = html; b.classList.add('show');
  clearTimeout(bubbleTimer);
  if (duration) bubbleTimer = setTimeout(() => b.classList.remove('show'), duration);
}
function petMe(e) {
  say(['好舒服~ 再摸摸 🥰','嘿嘿，别停～','MiMo 最喜欢你啦！'][Math.floor(Math.random() * 3)]);
  for (let i = 0; i < 6; i++) {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = ['🧡','💛','❤️'][i % 3];
    h.style.left = (pet.offsetLeft + 40 + Math.random() * 100) + 'px';
    h.style.top  = (pet.offsetTop + 60 + Math.random() * 40) + 'px';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 1100);
  }
}
function togglePanel() { $('#panel').classList.toggle('show'); }

const idleLines = ['点我一下就能查余额哦～ 💰','今天也要元气满满！(＾▽＾)',
  '要不要摸摸我？','拖我可以把我搬到别的地方～'];
setInterval(() => {
  if (!dragging && Math.random() < .5 && !$('#bubble').classList.contains('show'))
    say(idleLines[Math.floor(Math.random() * idleLines.length)], 3400);
}, 16000);

initSettings();
</script>
</body>
</html>
