plugins { id 'com.android.application' }

android {
    namespace 'com.mimo.pet'
    compileSdk 34

    defaultConfig {
        applicationId "com.mimo.pet"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 零第三方依赖，纯系统 WebView
}
